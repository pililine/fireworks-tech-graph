name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PNG renderer dependency (cairosvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Shell syntax check
        run: bash -n scripts/*.sh

      - name: Python syntax check
        run: python -m py_compile scripts/generate-from-template.py

      - name: Regression test (all styles)
        run: bash scripts/test-all-styles.sh
